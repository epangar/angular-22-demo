<p>For and if components</p>


<ul>
    @for(num of numArray; track num){
        <li>
            @if (num % 15 === 0){
                FizzBuzz    
            } @else if( num % 5 === 0){
                Buzz
            } @else if( num % 3 === 0){
                Fizz
            } @else {
                {{num}}
            }
        </li>
    }
</ul>
