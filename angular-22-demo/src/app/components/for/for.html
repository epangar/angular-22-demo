<p>For and if components</p>


<ul>
    @for(num of numArray; track num.value){
        <li [class]="num.color">
            @if (num.value % 15 === 0){
                FizzBuzz    
            } @else if( num.value % 5 === 0){
                Buzz
            } @else if( num.value % 3 === 0){
                Fizz
            } @else {
                {{num.value}}
            }
        </li>
    }
</ul>
